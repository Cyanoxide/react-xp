<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <title>DOOM</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
            * { box-sizing: border-box; }
            html, body { height: 100%; margin: 0; }
            body {
                background: #000;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* Fill the frame, keep the 4:3 bitmap aspect, render crisp pixels.
               The canvas must have no border/padding or mouse coords drift. */
            canvas#canvas {
                background: #000;
                display: block;
                height: 100%;
                width: auto;
                max-width: 100%;
                image-rendering: pixelated;
                outline: none;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <script>
            // PrBoom+ (Dwasm WebAssembly build). Music (OPL2 synth) and SFX are on by
            // default; audio starts on the first click/keypress in the window (browser
            // autoplay policy). No on-screen loading bar or splash — just the canvas.
            var canvas = document.getElementById("canvas");
            var focusCanvas = function () { try { canvas.focus(); } catch (e) {} };
            window.addEventListener("pointerdown", focusCanvas);
            window.addEventListener("load", focusCanvas);

            var Module = {
                canvas: canvas,
                arguments: ["-iwad", "DOOM1.WAD"],
                preRun: [function () {
                    // Mount the shareware IWAD into the engine's filesystem
                    FS.createPreloadedFile("/", "DOOM1.WAD", "doom1.wad", true, true);
                }],
                print: function (text) { console.log(text); },
                printErr: function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
                    console.error(text);
                },
                // No on-screen status/loading UI — log to the console only.
                setStatus: function (text) { if (text) console.log("[doom] " + text); },
                monitorRunDependencies: function () {},
            };

            canvas.addEventListener("webglcontextlost", function (e) {
                console.warn("DOOM WebGL context lost — reopen the window to restart.");
                e.preventDefault();
            }, false);
        </script>
        <script src="index.js"></script>
    </body>
</html>
