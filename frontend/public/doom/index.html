<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8" />
        <title>DOOM</title>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
            * { box-sizing: border-box; }
            html, body { height: 100%; margin: 0; }
            body {
                background: #000;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* Fill the frame, keep the 4:3 bitmap aspect, render crisp pixels.
               The canvas must have no border/padding or mouse coords drift. */
            canvas#canvas {
                background: #000;
                display: block;
                height: 100%;
                width: auto;
                max-width: 100%;
                image-rendering: pixelated;
                outline: none;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
        <script>
            // PrBoom+ (Dwasm WebAssembly build). Music (OPL2 synth) and SFX are on by
            // default; audio starts on the first click/keypress in the window (browser
            // autoplay policy). No on-screen loading bar or splash — just the canvas.
            var canvas = document.getElementById("canvas");
            var focusCanvas = function () { try { canvas.focus(); } catch (e) {} };
            window.addEventListener("pointerdown", focusCanvas);
            window.addEventListener("load", focusCanvas);

            // Bring DOOM's main menu up on its own, so the player lands on the menu
            // (New Game / Options / ...) instead of the attract-mode demo — no key
            // press needed. Esc is what DOOM uses to open the menu; we fire it once,
            // as soon as the engine is running (title music registering is the cue),
            // with a timed fallback.
            var menuOpened = false;
            function openDoomMenu() {
                if (menuOpened) return;
                menuOpened = true;
                window.focus();
                ["keydown", "keyup"].forEach(function (type, i) {
                    setTimeout(function () {
                        window.dispatchEvent(new KeyboardEvent(type, { key: "Escape", code: "Escape", keyCode: 27, which: 27, bubbles: true, cancelable: true }));
                    }, 400 + i * 70);
                });
            }
            setTimeout(openDoomMenu, 6000);

            var Module = {
                canvas: canvas,
                // -nomouse stops SDL grabbing the pointer (pointer lock); otherwise the
                // browser eats the first Esc to release the lock, forcing a double-press
                // to reach the menu. Without it a single Esc always works — play with
                // the keyboard (arrows move/turn, Ctrl fire, Space use).
                arguments: ["-iwad", "DOOM1.WAD", "-nomouse"],
                preRun: [function () {
                    // Mount the shareware IWAD into the engine's filesystem
                    FS.createPreloadedFile("/", "DOOM1.WAD", "doom1.wad", true, true);
                }],
                print: function (text) {
                    if (/Exp_RegisterSongEx|G_DoPlayDemo|gamestate/i.test(text)) openDoomMenu();
                    console.log(text);
                },
                printErr: function (text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(" ");
                    console.error(text);
                },
                // No on-screen status/loading UI — log to the console only.
                setStatus: function (text) { if (text) console.log("[doom] " + text); },
                monitorRunDependencies: function () {},
            };

            canvas.addEventListener("webglcontextlost", function (e) {
                console.warn("DOOM WebGL context lost — reopen the window to restart.");
                e.preventDefault();
            }, false);
        </script>
        <script src="index.js"></script>
    </body>
</html>
